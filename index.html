<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>homepage</title>
<style>
  :root {
    color: #292929;
    background: #f1f1f1;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    margin: 0;
  }

  .hero {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 48px 24px;
  }

  h1 {
    margin: 0 0 24px;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: normal;
    letter-spacing: 0.02em;
  }

  ul {
    margin: 0;
    padding-left: 24px;
    font-size: 1.15rem;
  }

  a {
    color: #4a4a4a;
    text-underline-offset: 4px;
  }

  a:hover {
    color: #111111;
  }

  footer {
    max-width: 520px;
    margin-top: 64px;
    color: #707070;
    font-size: 0.9rem;
    line-height: 1.6;
  }
</style>
</head>
<body>
 
  <div class="hero">
    <h1>my websites</h1>
 
    <ul>
      <li><a href="https://fractal.nowhere.red/">fractal generator</a></li>
    </ul>
 
    <footer>
      all of this is running on my own hardware (dell r630) deployed with kubernetes and self hosted github actions
    </footer>
  </div>
 
</body>
</html>
