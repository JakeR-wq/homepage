<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>homepage</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #1a1a1a;
    color: #fff;
  }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2em;
    text-align: center;
  }
  h1 {
    font-size: 2.5em;
    font-weight: 600;
    margin: 0 0 1.2em 0;
    padding: 0.3em 0.8em;
    background-color: #ff5d5d;
    color: #fff;
    border-radius: 8px;
    letter-spacing: 0.02em;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0 0 3em 0;
  }
  li + li {
    margin-top: 0.6em;
  }
  a {
    color: #fff;
    text-decoration: none;
    font-size: 1.1em;
    padding: 0.6em 1.2em;
    border: 1px solid #ff5d5d;
    border-radius: 6px;
    transition: background-color 0.15s ease;
  }
  a:hover {
    background-color: #ff5d5d;
  }
  footer {
    font-size: 0.85em;
    color: #888;
    max-width: 30em;
  }
</style>
</head>
<body>

  <div class="hero">
    <h1>my websites</h1>

    <ul>
      <li><a href="https://fractal.nowhere.red/">fractal generator</a></li>
    </ul>

    <footer>
      all of this is running on my own hardware (dell r630) deployed with kubernetes and self hosted github actions
    </footer>
  </div>

</body>
</html>
